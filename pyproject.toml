[project]
name = "whiteboard"
version = "0.1.0"
description = "Local per-project visual whiteboard for planning with Claude Code: markdown/Mermaid files <-> tldraw canvas <-> MCP"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "watchdog>=6.0.0",
    "pyyaml>=6.0.3",
    "pydantic>=2.13.5",
    "mcp>=2.2.0",
    "typer>=0.27.2",
    "httpx2>=2.13.0",
]

[project.scripts]
whiteboard = "whiteboard.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whiteboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["slow: real filesystem/network tests"]
